<!doctype html>
<html>
    <head>
        <title>Affrontement croustillant- Kelly</title>
        <link rel="stylesheet" href="./css/tictactoe.css">
    </head>
    <body>
        
        <header>
            <h1>L'affrontement croustillant!</h1>
        </header>

        <section id="loading">
            <h2>L'affrontement croustillant! &#128020; &#127839;</h2>
            <button id="commencer">jouer</button>
        </section>

        <section id="friteuse">
            <div class="case"></div>
            <div class="case"></div>
            <div class="case"></div>
            <div class="case"></div>
            <div class="case"></div>
            <div class="case"></div>
            <div class="case"></div>
            <div class="case"></div>
            <div class="case"></div>
        </section>

        <section id="poulet">
            <img src="./img/fried chicken-raw1.svg" alt="">
        </section>

        <section id="fries">
            <img src="./img/fries-raw.svg" alt=""> 
        </section>

        <section id="boite-message">
            <p id="message"></p>
            <nav>
                <button id="replay">Encore un plat!</button>
            </nav> 
            <!-- <img src="./img/fried_chicken.svg" alt="">
            <img src="./img/fries.svg" alt=""> -->
        </section>

        <audio id="son">
            <source src="sound/sound-web2_mixdown.mp3" type="audio/mp3">
        </audio>
        
        <audio id="poulet-crisp">
            <source src="sound/crisp-chicken_mixdown.mp3" type="audio/mp3">
        </audio>
        
        <audio id="frite-crisp">
            <source src="sound/crisp-fries_mixdown.mp3" type="audio/mp3">
        </audio>
            
        <audio id="lost">
            <source src="sound/lost_mixdown.mp3" type="audio/mp3">
        </audio>
        
        <audio id="win">
            <source src="sound/win_mixdown.mp3" type="audio/mp3">
        </audio>

        <script src="./js/tictactoe.js"></script>

    </body>
</html>
