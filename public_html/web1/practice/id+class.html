<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box {
            width: 200px;
            height: 200px;
            background-color: rgb(117, 175, 175);
        }
        .circle {
            width: 150px;
            height: 150px;
            background-color: bisque;
            border-radius: 100%;
        }
        .different {
            background-color: brown;
        }
    </style>
</head>
<body>
    
    <div id="box"></div>
    <div class="circle"></div> 
    <div class="circle different"></div>   
    <div class="circle"></div>
</body>
</html>
